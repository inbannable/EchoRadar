[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echoradar-ml"
version = "0.1.0"
description = "Deterministic CS2 sound-event dataset and model pipeline for EchoRadar"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
train = [
    "torch>=2.5,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
test = ["pytest>=8,<10"]

[project.scripts]
echoradar-ml = "echoradar_ml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["echoradar_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
